# Checks run before each commit, the same ones CI runs (CONTRIBUTING.md).
# Set up once:  uvx pre-commit install
# Run by hand:  uvx pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint and docstrings)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (types)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
