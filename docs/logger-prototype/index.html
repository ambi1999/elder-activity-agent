<style>
/* Sensor Logger prototype styles (publisher colours: navy seed, teal accent).

:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1119; --surface: #111a25; --card: #172231; --text: #e6ebf1; --muted: #9aa6b4; --line: #2a3747;
  --primary: #13294a; --accent: #5fc0c8; --bar: #5fc0c8;
  --red: #ffb4ab; --red-bg: #3b1714; --red-line: #6b2a24; --amber: #ffcf8a; --amber-bg: #33240b; --amber-line: #6b4d14;
  --green: #9ad69e; --green-bg: #12291a; --green-line: #2c5a33; --tg: #0e1621; --tg-bubble: #1c2a3a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1119; --surface: #111a25; --card: #172231; --text: #e6ebf1; --muted: #9aa6b4; --line: #2a3747;
  --primary: #13294a; --accent: #5fc0c8; --bar: #5fc0c8;
  --red: #ffb4ab; --red-bg: #3b1714; --red-line: #6b2a24; --amber: #ffcf8a; --amber-bg: #33240b; --amber-line: #6b4d14;
  --green: #9ad69e; --green-bg: #12291a; --green-line: #2c5a33; --tg: #0e1621; --tg-bubble: #1c2a3a; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.skip:focus { top: 8px; }

/* ---------- prototype toolbar (not part of the app) ---------- */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--card); }
.proto .tag { font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
.proto button, .proto select { min-height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0 12px; cursor: pointer; }
.proto label { display: inline-flex; gap: 6px; align-items: center; }
.simul { position: relative; } .simul summary { min-height: 36px; display: inline-flex; align-items: center; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; list-style: none; }
.simul summary::-webkit-details-marker { display: none; }

.tour p { margin: 0; flex: 1 1 260px; min-width: 0; }
@media (max-width: 600px) { .tour { gap: 6px; } .tour p { flex-basis: 100%; font-size: 13px; } .tour button { flex: 1; } }
.tour b { color: var(--accent); }

/* ---------- the app ---------- */
.stagewrap { padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.device { margin: 0 auto; background: var(--surface); border-radius: 18px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.12);
  display: grid; grid-template-columns: 1fr; min-height: 640px; max-width: 1100px; }
.framed .device { max-width: 390px; min-height: 780px; border: 2px solid var(--text); border-radius: 28px; }
.side { display: none; }
.top { background: var(--primary); color: var(--on-primary); min-height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px; }
.top h1 { font-size: 18px; margin: 0 4px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top h1:focus { outline: none; }
.iconbtn { width: var(--tap); height: var(--tap); border-radius: 50%; border: 0; background: transparent; color: inherit; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; text-decoration: none; flex: none; }
.iconbtn svg { width: 24px; height: 24px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--on-primary); color: var(--primary); font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
.spacer { width: 12px; }
.menu { position: absolute; right: 8px; top: 52px; z-index: 20; background: var(--card); color: var(--text); border: 1px solid var(--line);
  border-radius: 12px; min-width: 230px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 6px; }
.menu .who { padding: 10px 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px; font-size: 13px; color: var(--muted); }
.menu .who b { display: block; color: var(--text); font-size: 15px; }
.menu a, .menu button { display: flex; width: 100%; min-height: 44px; align-items: center; padding: 0 12px; border-radius: 8px; border: 0;
  background: none; text-decoration: none; color: var(--text); cursor: pointer; text-align: left; }
.menu a:hover, .menu button:hover { background: var(--surface); }
.main { position: relative; display: flex; flex-direction: column; min-width: 0; }
.content { padding: 14px 16px 24px; flex: 1; }
.tabs { display: flex; background: var(--card); border-top: 1px solid var(--line); position: sticky; bottom: 0; }
.tabs a { flex: 1; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 600; }
.tabs a svg { width: 24px; height: 24px; }
.tabs a[aria-current="page"] { color: var(--accent); }
.tabs a[aria-current="page"] .pill { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.pill { border-radius: 16px; padding: 3px 18px; display: inline-flex; }
.foot { text-align: center; font-size: 11px; letter-spacing: .08em; color: var(--muted); padding: 10px 0 4px; }

@media (min-width: 900px) {
  body:not(.framed) .device { grid-template-columns: 220px 1fr; }
  body:not(.framed) .side { display: flex; flex-direction: column; background: var(--card); border-right: 1px solid var(--line); padding: 14px 10px; gap: 4px; }
  body:not(.framed) .side .brand { font-weight: 700; color: var(--primary); padding: 6px 10px 14px; font-size: 16px; text-decoration: none; }
  body:not(.framed) .side a.nav { min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 10px;
    text-decoration: none; color: var(--text); font-weight: 600; }
  body:not(.framed) .side a.nav svg { width: 22px; height: 22px; color: var(--muted); }
  body:not(.framed) .side a.nav[aria-current="page"] { background: var(--surface); color: var(--accent); }
  body:not(.framed) .side a.nav[aria-current="page"] svg { color: var(--accent); }
  body:not(.framed) .tabs { display: none; }
  body:not(.framed) .content { padding: 20px 28px 32px; max-width: 920px; }

}

/* ---------- components ---------- */

.label { color: var(--muted); font-size: 12px; }
.num { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.row:last-child { border-bottom: 0; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
.list a.item, .list .item { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; text-decoration: none; color: var(--text);
  border-bottom: 1px solid var(--line); }
.list .item:last-child { border-bottom: 0; }
.list a.item:hover { background: var(--surface); }
.item .grow { flex: 1; min-width: 0; } .item small { display: block; color: var(--muted); font-size: 13px; }
.chev { color: var(--muted); flex: none; }
.btn { display: flex; align-items: center; justify-content: center; min-height: var(--tap); width: 100%; border-radius: 12px; border: 2px solid var(--primary);
  background: var(--primary); color: var(--on-primary); font-weight: 600; cursor: pointer; text-decoration: none; margin: 10px 0; padding: 0 16px; }
.btn.secondary { background: transparent; color: var(--text); border-color: var(--line); }
.btn.danger { background: transparent; color: var(--red); border-color: var(--red-line); }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; } .btnrow .btn { flex: 1 1 140px; width: auto; }
.field { margin-bottom: 14px; } .field label { display: block; font-weight: 600; margin-bottom: 4px; }
.field input, .field select { width: 100%; min-height: var(--tap); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--card); }
.field .hint { color: var(--muted); font-size: 13px; margin-top: 4px; } .field .error { color: var(--red); font-size: 13px; margin-top: 4px; font-weight: 600; }
.radios { display: flex; gap: 10px; flex-wrap: wrap; } .radios label { display: inline-flex; gap: 8px; align-items: center; min-height: 44px; font-weight: 400;
  border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; background: var(--card); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* statuses: colour + icon + words, never colour alone */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 6px; }

.chip.red { color: var(--red); background: var(--red-bg); border-color: var(--red-line); }
.chip.amber { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-line); }
.chip.green { color: var(--green); background: var(--green-bg); border-color: var(--green-line); }
.st { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; flex: none; }
.st svg { width: 22px; height: 22px; }
.st.red { color: var(--red); } .st.amber { color: var(--amber); } .st.green { color: var(--green); }
.person { border-left: 6px solid transparent; }
.person.red { border-left-color: var(--red); } .person.amber { border-left-color: var(--amber); }
.peoplegrid .person { border: 1px solid var(--line); border-left-width: 6px; border-radius: var(--radius); background: var(--card); margin-bottom: 8px; }
.peoplegrid .person.green { border-left-color: var(--line); }
.peoplegrid .person.red { border-left-color: var(--red); } .peoplegrid .person.amber { border-left-color: var(--amber); }
.banner { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; border: 1px solid; }
.banner.red { background: var(--red-bg); border-color: var(--red-line); }
.banner.amber { background: var(--amber-bg); border-color: var(--amber-line); }
.banner.green { background: var(--green-bg); border-color: var(--green-line); }
.banner b { display: block; }
.banner.red b { color: var(--red); } .banner.amber b { color: var(--amber); } .banner.green b { color: var(--green); }

/* charts */
.bars { display: flex; align-items: flex-end; gap: 3px; height: 72px; border-bottom: 1px solid var(--line); margin-top: 8px; }
.bars i { flex: 1; background: var(--bar); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .85; }
.bars.small { height: 36px; }
.axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 2px; }

table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }

.qr { width: 180px; height: 180px; margin: 10px auto; border: 10px solid #fff; outline: 1px solid var(--line);
  background: repeating-conic-gradient(#1b2430 0 25%, #fff 0 50%) 0 0/20px 20px; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; overflow-wrap: anywhere; }
.timeline { list-style: none; margin: 0; padding: 0; } .timeline li { padding: 8px 0 8px 18px; border-left: 2px solid var(--line); position: relative; font-size: 14px; }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.tg { background: var(--tg); border-radius: var(--radius); padding: 12px; }
.bubble { background: var(--tg-bubble); border-radius: 14px 14px 14px 4px; padding: 10px 12px; margin: 8px 0; max-width: 92%; }
.bubble .kb { margin-top: 8px; text-align: center; border-radius: 10px; background: var(--surface); padding: 10px; font-weight: 600; color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-weight: 600; max-width: 90vw; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }
.muted { color: var(--muted); }

/* logger-specific */
.big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--green); margin-right: 6px; }
.dot.off { background: var(--muted); }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }

.switch span::after { content: ""; position: absolute; left: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: left .15s; }
.switch input:checked + span { background: var(--accent); border-color: var(--accent); }
.switch input:checked + span::after { left: 24px; background: #fff; }
.switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.cam { height: 300px; border-radius: var(--radius); background: #1b2430; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.cam .frame { width: 180px; height: 180px; border: 3px solid #fff; border-radius: 16px; background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0/20px 20px; }

/* ---------- on a real phone (or installed to the home screen): look and behave like the app ---------- */
.field input[type="radio"], .field input[type="checkbox"], .radios input { width: auto; min-height: 0; flex: none; }
.protofab, .closeproto { display: none; }
#tour button { min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 10px; padding: 0 14px; cursor: pointer; font-weight: 600; }
#tour button:disabled { opacity: .45; cursor: default; }
#tour { margin: 8px max(16px, env(safe-area-inset-left, 0px)) 0 max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 600px), (display-mode: standalone) {
  body::before { background: var(--primary); }

  .device, .framed .device { border-radius: 0; border: 0; box-shadow: none; max-width: none; min-height: 0; }

  .protofab svg { width: 22px; height: 22px; }

}

</div>

<script>
/* Sensor Logger: clickable prototype of the Android app (releases R1 and R2, ADR 0021).
 *
 * A small single-page app with made-up data. Every screen has its own address
 * (#home, #recording-1, #consent ...), so the bottom navigation, the back
 * arrows and the browser's back button work as Android's will. Actions change
 * the data until the page is reloaded (or reset). The receiver shown is a
 * generic example: the app knows no consuming project (ADR 0011).
 */
(function () {
  'use strict';

  const APP = 'Sensor Logger (dev)'; // app.display_name; the public name is chosen later (ADR 0012)
  const PUBLISHER = 'TechData Innovate'; // shown in About only

  const I = {
    back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    chev: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    home: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9H14v-6H10v6H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    list: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    gear: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
  };
  const SENSORS = [
    ['steps', 'Steps', 'Step count from the phone’s pedometer', '4,112'],
    ['light', 'Light', 'Brightness around the phone, in lux', '120 lux'],
    ['battery', 'Battery', 'Level and whether it is charging', '57%, not charging'],
    ['screen', 'Screen', 'When the screen turns on or off', 'On'],
    ['activity', 'Activity', 'Still, walking, cycling or in a vehicle', 'Walking (87%)'],
    ['motion', 'Motion', 'Movement strength, as one-minute summaries', '1.4 m/s²'],
    ['location', 'Location', 'Approximate area (about 1 km); off unless you turn it on', '–']
  ];

  function freshData() {
    return {
      recording: true, elapsed: 2 * 3600 + 14 * 60 + 37, readings: 18402,
      profile: 'activity',
      on: { steps: true, light: true, battery: true, screen: true, activity: false, motion: true, location: false },
      granted: { activity: false, location: false },
      recordings: [
        { id: 2, title: '18 Nov 2026, 08:02', duration: '9 h 42 min', items: '41,288 readings · 582 summaries' },
        { id: 1, title: '17 Nov 2026, 07:51', duration: '10 h 05 min', items: '43,010 readings · 605 summaries' }
      ],
      connection: 'none', // none | connected | rejected
      pending: null, consentAt: null, lastUpload: null
    };
  }
  let D = freshData();

  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clock = (s) => [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map((n) => String(n).padStart(2, '0')).join(':');
  let toastTimer;
  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; announce(msg);
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200); }
  function announce(msg) { document.getElementById('live').textContent = msg; }
  const item = (href, title, sub) => `<a class="item" href="#${href}"><span class="grow">${title}${sub ? `<small>${sub}</small>` : ''}</span><span class="chev">${I.chev}</span></a>`;

  // ------------------------------------------------------------------ screens
  const routes = [
    [/^home$/, home], [/^recordings$/, recordings], [/^recording-(\d+)$/, recording],
    [/^prefs$/, prefs], [/^sensors$/, sensors], [/^why-(activity|location)$/, why],
    [/^connection$/, connection], [/^connect$/, connect], [/^scan$/, scan], [/^consent$/, consent], [/^about$/, about]
  ];

  function home() {
    const rows = SENSORS.map(([id, name, , value]) => `<div class="row"><span>${name}</span><span class="${D.on[id] ? '' : 'muted'}">${D.on[id] && D.recording ? value : 'Off'}</span></div>`).join('');
    const conn = D.connection === 'connected' ? `<a class="item" href="#connection"><span class="grow"><span class="dot"></span>Uploading to receiver.example.com<small>Last upload ${esc(D.lastUpload)}</small></span><span class="chev">${I.chev}</span></a>`
      : D.connection === 'rejected' ? `<a class="item" href="#connection"><span class="grow"><b style="color:var(--amber)">Uploads paused</b><small>The receiver no longer accepts this phone. Set up again.</small></span><span class="chev">${I.chev}</span></a>`
      : item('connection', 'Not connected', 'Recordings stay on this phone. Connect to share them.');
    return { title: APP, up: null, tab: 'home', body: `
      <div class="card"><div class="row"><span>Status</span><b style="color:${D.recording ? 'var(--green)' : 'var(--muted)'}"><span class="dot${D.recording ? '' : ' off'}"></span>${D.recording ? 'Recording' : 'Stopped'}</b></div>
        <div class="big" id="elapsed" aria-label="Recording time">${D.recording ? clock(D.elapsed) : '00:00:00'}</div>
        <div class="label">${D.recording ? D.readings.toLocaleString('en-AU') + ' readings stored · 3.1 MB' : 'Not recording'}</div></div>
      <h2>Latest values</h2><div class="card">${rows}</div>
      <div class="list">${conn}</div>
      <button class="btn" data-action="toggle-rec">${D.recording ? 'Stop recording' : 'Start recording'}</button>` };
  }
  function recordings() {
    return { title: 'Recordings', up: null, tab: 'recordings', body: D.recordings.length
      ? `<div class="list">${D.recordings.map((r) => item(`recording-${r.id}`, `<b>${esc(r.title)}</b>`, `${esc(r.duration)} · ${esc(r.items)}`)).join('')}</div>
         <p class="muted" style="font-size:13px">Recordings are kept for 7 days, then deleted automatically.</p>`
      : '<div class="card empty">No recordings yet. Start one from Home.</div>' };
  }
  function recording(id) {
    const r = D.recordings.find((x) => String(x.id) === id); if (!r) return notFound();
    return { title: r.title, up: 'recordings', tab: 'recordings', body: `
      <div class="card"><div class="row"><span>Duration</span><b>${esc(r.duration)}</b></div><div class="row"><span>Items</span><span>${esc(r.items)}</span></div>
        <div class="row"><span>Sensors</span><span>steps, light, battery, screen, motion</span></div></div>
      <form data-form="export" data-id="${r.id}"><fieldset class="field" style="border:0;padding:0;margin:0"><legend style="font-weight:600;margin-bottom:6px">Export as</legend>
        <div class="radios" style="flex-direction:column"><label><input type="radio" name="fmt" value="CSV files" checked> CSV files (one per sensor, zipped)</label>
        <label><input type="radio" name="fmt" value="Protocol v1 JSON"> Protocol v1 JSON batches (zipped)</label></div></fieldset>
        <div class="btnrow"><button class="btn" type="submit" name="how" value="share">Share…</button><button class="btn secondary" type="submit" name="how" value="save">Save to files</button></div></form>
      <button class="btn danger" data-action="delete" data-id="${r.id}">Delete recording</button>` };
  }
  function prefs() {
    const connSub = D.connection === 'connected' ? 'Connected to receiver.example.com' : D.connection === 'rejected' ? 'Uploads paused: set up again' : 'Not connected';
    return { title: 'Settings', up: null, tab: 'prefs', body: `<div class="list">
      ${item('sensors', 'Sensors', `Profile: ${D.profile} · ${Object.values(D.on).filter(Boolean).length} of 7 on`)}
      ${item('connection', 'Connection', connSub)}${item('about', 'About', 'Version, licences, privacy')}</div>
      <div class="card"><div class="row"><span>Keep recordings for</span><b>7 days</b></div><div class="row"><span>Upload every</span><b>15 minutes</b></div></div>
      <button class="btn danger" data-action="delete-all">Delete all data</button>` };
  }
  function sensors() {
    const row = ([id, name, desc]) => {
      const needs = (id === 'activity' || id === 'location') && !D.granted[id];
      return `<div class="item"><span class="grow"><b>${name}</b><small>${esc(desc)}${needs ? ' · <b style="color:var(--amber)">needs your permission</b>' : ''}</small></span>
        <span class="switch"><input type="checkbox" role="switch" id="s-${id}" data-sensor="${id}" ${D.on[id] ? 'checked' : ''} aria-label="${name}"><span></span></span></div>`; };
    return { title: 'Sensors', up: 'prefs', tab: 'prefs', body: `
      <div class="field"><label for="f-profile">Profile</label><select id="f-profile" data-profile>
        ${['minimal', 'activity', 'full'].map((p) => `<option ${D.profile === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
        <div class="hint">A profile switches a set of sensors on or off together. You can still change each one.</div></div>
      <div class="list">${SENSORS.map(row).join('')}</div>
      <p class="muted" style="font-size:13px">Each sensor is explained before any permission is asked for.</p>` };
  }
  function why(id) {
    const text = id === 'activity'
      ? 'Activity recognition tells the app whether you are still, walking or in a vehicle. Android asks for your permission. The data stays on this phone unless you connect to a receiver.'
      : 'Location is recorded only roughly (about 1 km) and only while recording. Android asks for your permission. Most uses don’t need it; you can leave it off.';
    return { title: id === 'activity' ? 'Activity' : 'Location', up: 'sensors', tab: 'prefs', body: `<div class="card">${text}</div>
      <div class="btnrow"><button class="btn secondary" data-action="perm-no" data-sensor="${id}">Not now</button>
      <button class="btn" data-action="perm-yes" data-sensor="${id}">Continue to permission</button></div>` };
  }
  function connection() {
    if (D.connection === 'connected') return { title: 'Connection', up: 'prefs', tab: 'prefs', body: `
      <div class="banner green"><b>Connected</b>receiver.example.com<div class="label">Token …x7Qa · consent given ${esc(D.consentAt)}</div></div>
      <div class="card"><div class="row"><span>Last upload</span><span>${esc(D.lastUpload)}, 214 items accepted</span></div>
        <div class="row"><span>Waiting to send</span><span>0 batches</span></div><div class="row"><span>Shared</span><span>6 sensors, every 15 min</span></div></div>
      <div class="btnrow"><button class="btn secondary" data-action="test">Test connection</button><button class="btn danger" data-action="remove-conn">Remove connection</button></div>` };
    if (D.connection === 'rejected') return { title: 'Connection', up: 'prefs', tab: 'prefs', body: `
      <div class="banner amber"><b>Token not accepted</b>The receiver no longer accepts this phone’s token. Uploads are paused; recordings stay on the phone.</div>
      <a class="btn" href="#connect">Set up again</a><button class="btn danger" data-action="remove-conn">Remove connection</button>` };
    return { title: 'Connection', up: 'prefs', tab: 'prefs', body: `
      <div class="card"><b>Not connected</b><p class="muted" style="margin:4px 0 0">Recordings stay on this phone. To share them, connect to a receiver: any service that supports the open protocol v1.</p></div>
      <a class="btn" href="#connect">Connect to a receiver</a>` };
  }
  function connect() {
    return { title: 'Connect', up: 'connection', tab: 'prefs', body: `
      <a class="btn" href="#scan">Scan setup QR code</a><p class="muted" style="font-size:13px;margin-top:0">Uses Google’s code scanner: this app never gets camera permission.</p>
      <h2>Or enter by hand</h2><form data-form="manual" novalidate>
        <div class="field"><label for="f-endpoint">Receiver address</label><input id="f-endpoint" type="url" placeholder="https://receiver.example.com/v1/readings" autocomplete="off"><div class="error" id="e-endpoint" hidden></div></div>
        <div class="field"><label for="f-token">Device token</label><input id="f-token" type="password" autocomplete="off"><div class="error" id="e-token" hidden></div></div>
        <button class="btn secondary" type="submit">Next</button></form>` };
  }
  function scan() {
    return { title: 'Scan setup QR code', up: 'connect', tab: 'prefs', body: `<div class="cam" role="img" aria-label="Camera view (example)"><div class="frame"></div></div>
      <p class="muted" style="text-align:center">Point the camera at the setup code shown by the receiver.</p>
      <button class="btn" data-action="scanned">Prototype: code read</button>` };
  }
  function consent() {
    if (!D.pending) D.pending = { name: 'Family phone 1', host: 'receiver.example.com' };
    const on = Object.entries(D.on).filter(([k, v]) => v && k !== 'location').map(([k]) => SENSORS.find((s) => s[0] === k)[1]);
    return { title: 'Share your data?', up: 'connect', tab: 'prefs', body: `
      <div class="card"><div class="label">Receiver</div><b>${esc(D.pending.name)}</b><div class="muted">${esc(D.pending.host)}</div></div>
      <div class="card"><div class="row"><span>What is sent</span><span>${esc(on.join(', '))}</span></div><div class="row"><span>Location</span><span class="muted">Not sent</span></div>
        <div class="row"><span>How often</span><span>Every 15 minutes</span></div></div>
      <p class="muted">You can stop sharing at any time in Settings › Connection. Nothing is sent until you agree.</p>
      <div class="btnrow"><button class="btn secondary" data-action="decline">Don’t share</button><button class="btn" data-action="agree">I agree</button></div>` };
  }
  function about() {
    return { title: 'About', up: 'prefs', tab: 'prefs', body: `<div class="card"><div class="row"><span>App</span><b>${APP}</b></div>
      <div class="row"><span>Version</span><span>0.3.0 (prototype)</span></div><div class="row"><span>Protocol</span><span>phone-sensor-logger/v1</span></div></div>
      <div class="card"><b>by ${PUBLISHER}</b><div class="muted">Open-source licences · Privacy</div></div>` };
  }
  function notFound() { return { title: 'Not found', up: 'home', tab: null, body: '<div class="card empty">This screen doesn’t exist.</div><a class="btn" href="#home">Go home</a>' }; }

  // ------------------------------------------------------------------ shell
  const TABS = [['home', 'Home', I.home], ['recordings', 'Recordings', I.list], ['prefs', 'Settings', I.gear]];
  let rendered = false;
  function render() {
    const name = location.hash.replace(/^#/, '') || 'home';
    let page = notFound();
    for (const [re, fn] of routes) { const m = name.match(re); if (m) { page = fn(...m.slice(1)); break; } }
    const link = (t, side) => `<a class="${side ? 'nav' : ''}" href="#${t[0]}"${page.tab === t[0] ? ' aria-current="page"' : ''}>${side ? t[2] : `<span class="pill">${t[2]}</span>`}<span>${t[1]}</span></a>`;
    document.getElementById('app').innerHTML = `
      <nav class="side" aria-label="Main"><a class="brand" href="#home">${APP}</a>${TABS.map((t) => link(t, true)).join('')}</nav>
      <div class="main"><header class="top">${page.up ? `<a class="iconbtn" href="#${page.up}" aria-label="Back">${I.back}</a>` : '<span class="spacer"></span>'}
        <h1 tabindex="-1" id="pagetitle">${esc(page.title)}</h1></header>
        <main class="content" id="main">${page.body}</main>
        <nav class="tabs" aria-label="Main">${TABS.map((t) => link(t, false)).join('')}</nav></div>`;
    document.title = `${page.title} · ${APP}`;
    if (rendered) { document.getElementById('pagetitle').focus(); window.scrollTo(0, 0); }
    announce(page.title); syncTour(); rendered = true;
  }
  function go(name) { if (location.hash === '#' + name) render(); else location.hash = name; }
  setInterval(() => { if (!D.recording) return; D.elapsed += 1; D.readings += 3; const el = document.getElementById('elapsed'); if (el) el.textContent = clock(D.elapsed); }, 1000);

  // ------------------------------------------------------------------ actions
  document.addEventListener('click', (e) => {
    const sim = document.querySelector('.simul'); if (sim && sim.open && !e.target.closest('.simul summary')) sim.open = false;
    const b = e.target.closest('[data-action]'); if (!b) return;
    const act = b.dataset.action, now = new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
    if (act === 'toggle-rec') {
      if (D.recording) { D.recordings.unshift({ id: D.recordings.length + 1, title: 'Today, ' + now, duration: clock(D.elapsed).slice(0, 5).replace(':', ' h ') + ' min', items: D.readings.toLocaleString('en-AU') + ' readings' });
        D.recording = false; render(); toast('Recording stopped and saved.'); }
      else { D.recording = true; D.elapsed = 0; D.readings = 0; render(); toast('Recording started. It continues in the background.'); }
    }
    if (act === 'delete') { if (b.dataset.sure) { D.recordings = D.recordings.filter((r) => String(r.id) !== b.dataset.id); go('recordings'); toast('Recording deleted.'); }
      else { b.dataset.sure = '1'; b.textContent = 'Tap again to delete for good'; } }
    if (act === 'delete-all') { if (b.dataset.sure) { D.recordings = []; D.connection = 'none'; render(); toast('All recordings and the connection were deleted.'); }
      else { b.dataset.sure = '1'; b.textContent = 'Tap again to delete everything'; } }
    if (act === 'perm-yes') { D.granted[b.dataset.sensor] = true; D.on[b.dataset.sensor] = true; go('sensors'); toast('Permission given. ' + (b.dataset.sensor === 'activity' ? 'Activity' : 'Location') + ' is on.'); }
    if (act === 'perm-no') { go('sensors'); }
    if (act === 'scanned') { D.pending = { name: 'Family phone 1', host: 'receiver.example.com' }; go('consent'); }
    if (act === 'decline') { D.pending = null; go('connection'); toast('Nothing was saved or shared.'); }
    if (act === 'agree') { D.connection = 'connected'; D.consentAt = 'today, ' + now; D.lastUpload = now; D.pending = null; go('connection'); toast('Connected. The first upload worked.'); }
    if (act === 'test') { toast(D.connection === 'rejected' ? 'Token not accepted.' : 'Connected: the receiver answered.'); }
    if (act === 'remove-conn') { if (b.dataset.sure) { D.connection = 'none'; render(); toast('Connection removed. The token was deleted from this phone.'); }
      else { b.dataset.sure = '1'; b.textContent = 'Tap again to remove'; } }
    if (act === 'sim-reject') { if (D.connection === 'none') { toast('Connect first (Settings › Connection).'); return; } D.connection = 'rejected'; go('connection'); toast('Simulated: the receiver rejected the token.'); }
    if (act === 'reset') { D = freshData(); go('home'); toast('Prototype reset.'); }
  });
  document.addEventListener('change', (e) => {
    const s = e.target.dataset && e.target.dataset.sensor;
    if (s) { if ((s === 'activity' || s === 'location') && e.target.checked && !D.granted[s]) { e.target.checked = false; go('why-' + s); return; }
      D.on[s] = e.target.checked; announce(`${s} ${e.target.checked ? 'on' : 'off'}`); return; }
    if (e.target.matches('[data-profile]')) { D.profile = e.target.value;
      const sets = { minimal: ['steps', 'battery'], activity: ['steps', 'light', 'battery', 'screen', 'activity', 'motion'], full: SENSORS.map((x) => x[0]) };
      Object.keys(D.on).forEach((k) => { D.on[k] = sets[D.profile].includes(k) && (!(k in D.granted) || D.granted[k]); }); render(); toast(`Profile: ${D.profile}.`); }
  });
  function showError(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.hidden = !msg; }
  document.addEventListener('submit', (e) => {
    const f = e.target; e.preventDefault();
    if (f.dataset.form === 'manual') {
      const ep = document.getElementById('f-endpoint').value.trim(), tk = document.getElementById('f-token').value.trim();
      showError('e-endpoint', /^https:\/\/[^\s/]+/.test(ep) ? '' : 'Enter an address that starts with https://');
      showError('e-token', tk.length >= 20 ? '' : 'Enter the token from the receiver (at least 20 characters).');
      if (!/^https:\/\/[^\s/]+/.test(ep) || tk.length < 20) return;
      D.pending = { name: 'Receiver', host: ep.replace(/^https:\/\//, '').split('/')[0] }; go('consent');
    }
    if (f.dataset.form === 'export') { const how = e.submitter ? e.submitter.value : 'share'; const fmt = f.fmt.value;
      toast(how === 'share' ? `${fmt} ready to share (Android share sheet).` : `${fmt} saved to your files.`); }
  });

  // ------------------------------------------------------------------ guided tour
  const TOUR = [
    ['home', 'Home while recording: status, time, the latest value from each sensor. Recording carries on in the background.'],
    ['recordings', 'Recordings: each finished recording, kept for 7 days.'],
    ['recording-2', 'A recording can be exported as CSV or protocol v1 JSON, then shared or saved.'],
    ['sensors', 'Sensors: switch each on or off, or pick a profile. Try switching <b>Activity</b> on: it is explained before Android asks for permission.'],
    ['connection', 'From release R2 the app can upload to a receiver. Nothing is shared until you connect and agree.'],
    ['connect', 'Connect by scanning the receiver’s setup QR code, or type the address and token.'],
    ['consent', 'The phone’s owner sees who receives what, and how often, before anything is saved. Press <b>I agree</b>.'],
    ['connection', 'Connected: the last upload and what is shared. Use <b>Simulate…</b> to see what happens if the token is rejected.'],
    ['about', 'About shows the publisher; the app itself works with any receiver.']
  ];
  let tourAt = -1;
  function syncTour() {
    const box = document.getElementById('tour'); document.body.classList.toggle('touring', tourAt >= 0);
    if (tourAt < 0) { box.hidden = true; return; }
    box.hidden = false; document.getElementById('tourtext').innerHTML = `<b>${tourAt + 1} / ${TOUR.length}</b> · ${TOUR[tourAt][1]}`;
    document.getElementById('tprev').disabled = tourAt === 0; document.getElementById('tnext').disabled = tourAt === TOUR.length - 1;
  }
  function tourTo(k) { tourAt = Math.max(0, Math.min(TOUR.length - 1, k)); go(TOUR[tourAt][0]); }
  document.getElementById('tourbtn').onclick = () => { document.body.classList.remove('showproto'); if (tourAt < 0) tourTo(0); else { tourAt = -1; syncTour(); } };
  document.getElementById('tprev').onclick = () => tourTo(tourAt - 1);
  document.getElementById('tnext').onclick = () => tourTo(tourAt + 1);
  document.getElementById('frame').onchange = (e) => document.body.classList.toggle('framed', e.target.checked);
  // On phones the prototype controls open as a bottom sheet from the small "Prototype" button.
  const fab = document.getElementById('protofab');
  const sheet = (open) => { document.body.classList.toggle('showproto', open); fab.setAttribute('aria-expanded', String(open));
    if (open) document.getElementById('tourbtn').focus(); };
  fab.onclick = () => sheet(!document.body.classList.contains('showproto'));
  document.getElementById('closeproto').onclick = () => { sheet(false); fab.focus(); };

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body></html>
