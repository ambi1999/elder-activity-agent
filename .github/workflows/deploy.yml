name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # --locked fails the build if uv.lock is out of date with pyproject.toml
      - run: uv sync --locked
      - run: uv run pytest -q

  deploy:
    needs: test
    # Only deploy from main, never from pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait until the new commit is live
        run: |
          for i in $(seq 1 40); do
            if curl --silent "${{ secrets.RENDER_SERVICE_URL }}/health" | grep -q "${{ github.sha }}"; then
              echo "Commit ${{ github.sha }} is live"; exit 0
            fi
            echo "Waiting for deploy... ($i/40)"; sleep 20
          done
          echo "New version did not go live within ~13 minutes"; exit 1