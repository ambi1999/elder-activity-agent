name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # least privilege for the workflow token

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres for database tests (ADR 0018). Its password is not a secret.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/elder_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # --locked fails the build if uv.lock is out of date with pyproject.toml
      - run: uv sync --locked
      - run: uv run pytest -q -rs

  lint:
    # Style, docstrings and types (CONTRIBUTING.md). Fails the build on any finding.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint and docstrings (ruff)
        run: uv run ruff check --output-format github .
      - name: Formatting (ruff)
        run: uv run ruff format --check .
      - name: Types (mypy)
        run: uv run mypy

  audit:
    # Known vulnerabilities in locked dependencies block the deploy (ADR 0021).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check dependencies for known vulnerabilities
        run: |
          uv export --locked --format requirements-txt --no-emit-project --output-file /tmp/requirements.txt
          uvx pip-audit --requirement /tmp/requirements.txt --disable-pip

  deploy:
    needs: [test, lint, audit]
    # Only deploy from main, never from pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://elder-activity-agent.onrender.com/docs
    steps:
      - name: Trigger Render deploy
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait until the new commit is live
        run: |
          for i in $(seq 1 40); do
            if curl --silent "${{ secrets.RENDER_SERVICE_URL }}/health" | grep -q "${{ github.sha }}"; then
              echo "Commit ${{ github.sha }} is live"; exit 0
            fi
            echo "Waiting for deploy... ($i/40)"; sleep 20
          done
          echo "New version did not go live within ~13 minutes"; exit 1
