{% extends "base.html" %}
{% block content %}
{% if notice %}<p class="banner green" role="status">{{ notice }}</p>{% endif %}
<form method="post" action="/profile" novalidate>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field"><label for="u-name">Your name</label>
    <input id="u-name" name="name" value="{{ name }}" maxlength="60" required {% if error %}aria-invalid="true" aria-describedby="u-error"{% endif %}>
    {% if error %}<div class="error" id="u-error">{{ error }}</div>{% endif %}
    <p class="muted small">Others see this, for example "{{ name or "Daughter" }} is checking".</p></div>
  <button class="btn" type="submit">Save</button>
</form>
<div class="card"><div class="label">You sign in with</div><b>{{ me.email }}</b></div>
{% endblock %}
